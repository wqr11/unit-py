services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.python
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - 8000:8000
    env_file: ".env"
    networks:
      - unit_py_net
    develop:
      watch:
        - action: rebuild
          path: ./app
          target: ./src
          ignore:
            - __pycache__/

  db:
    image: postgres:16-alpine
    restart: always
    env_file: ".env"
    volumes:
      - ./pg-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - unit_py_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stage"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.2-alpine
    restart: always
    env_file: ".env"
    volumes:
      - ./redis-data:/data
    ports:
      - 6379:6379
    networks:
      - unit_py_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  unit_py_net:

services:
  db:
    image: postgres:16-alpine
    restart: always
    env_file: ".env"
    volumes:
      - ./pg-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - unit_py_net

  redis:
    image: redis:8.2-alpine
    restart: always
    env_file: ".env"
    volumes:
      - ./redis-data:/data
    ports:
      - 6379:6379
    networks:
      - unit_py_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.python
    ports:
      - 8000:8000
    env_file: ".env"
    networks:
      - unit_py_net
    develop:
      watch:
        - action: sync
          path: ./app
          target: ./src
          ignore:
            - __pycache__/

networks:
  unit_py_net:
